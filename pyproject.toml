[project]
name = "gh-review-agent"
version = "0.1.0"
description = "Watch GitHub PR activity and hand actionable PRs to a local coding agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
gh-review-agent = "gh_review_agent.app:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "C4",      # comprehensions
    "RUF",     # ruff-specific
    "PL",      # pylint
]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",  # size limits: poll() is one pass by design
    "PLR2004",  # magic values
    "PLW0603",  # module globals set once in main()
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

name: Release

# Run by hand (Actions → Release → Run workflow) on main. svu picks the next
# version from the Conventional Commit titles since the last tag (feat: minor,
# fix: patch, feat!: major), or the bump you choose. GoReleaser then creates
# the tag and the GitHub release with a grouped changelog and attaches the
# archives.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release # main only; maintainers approve the run
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release must not build from a cache other runs can write
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
      - run: task test
      - name: Next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          cmd=$([ "$BUMP" = auto ] && echo next || echo "$BUMP")
          version=$(go run github.com/caarlos0/svu/v3@v3.4.1 "$cmd")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version" >> "$GITHUB_STEP_SUMMARY"
      # Local tag only: GoReleaser needs it; GitHub creates the remote tag
      # together with the release.
      - run: git tag "${{ steps.version.outputs.version }}"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

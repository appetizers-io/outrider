name: Release

# Run by hand (Actions → Release → Run workflow) on main. git-cliff
# (cliff.toml) picks the next version from the Conventional Commit titles since
# the last tag (feat: minor, fix: patch), or the bump you choose, and writes the
# release notes. GoReleaser then creates the tag and the GitHub release with
# those notes and attaches the archives, publishes the Homebrew cask (only
# when the HOMEBREW_TAP_TOKEN secret is set) and the run attests the archives'
# build provenance.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release # main only; maintainers approve the run
    permissions:
      contents: write # create the tag and the release
      id-token: write # attestation: OIDC token for the Sigstore certificate
      attestations: write # attestation: store it on the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release must not build from a cache other runs can write
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
      - run: task test
      - name: git-cliff arguments
        id: args
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          bump=$([ "$BUMP" = auto ] && echo "--bump" || echo "--bump $BUMP")
          echo "args=--unreleased $bump --strip all -o RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"
      - name: Next version and release notes
        id: cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          args: ${{ steps.args.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # PR links and authors
      - name: Check version
        env:
          VERSION: ${{ steps.cliff.outputs.version }}
        run: |
          if [ -z "$VERSION" ] || [ "$VERSION" = null ] || git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::nothing to release (version: $VERSION)"; exit 1
          fi
          echo "Releasing $VERSION" >> "$GITHUB_STEP_SUMMARY"
          cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"
      # Local tag only: GoReleaser needs it; GitHub creates the remote tag
      # together with the release.
      - run: git tag "${{ steps.cliff.outputs.version }}"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean --release-notes RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # contents:write on appetizers-io/homebrew-tap only; unset skips the cask upload
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # Private repos need GitHub Enterprise Cloud for attestations; on another
      # plan this step fails while the repo is private, so it must not fail
      # the release then.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: ${{ github.event.repository.private }}
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

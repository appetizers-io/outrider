name: Kiro Crew app
on:
  pull_request:
    paths: ['apps/kiro-crew/**', 'Taskfile.yml', 'scripts/package_crew.py', '.github/workflows/crew.yml']
  push:
    branches: [main]
    paths: ['apps/kiro-crew/**', 'Taskfile.yml', 'scripts/package_crew.py', '.github/workflows/crew.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
      # Python 3 and Node.js are included in both hosted runner images.
      - run: task crew:test
      - run: task crew:package

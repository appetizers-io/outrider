# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: outrider

builds:
  - main: .
    binary: outrider
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/appetizers-io/outrider/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - src: internal/config/config.example.yaml
        dst: config.example.yaml
      - config.schema.json

checksum:
  name_template: checksums.txt

release:
  # the commit the workflow tested; GitHub creates the tag on it
  target_commitish: "{{ .Commit }}"

# No changelog section: the release workflow passes git-cliff's notes with
# --release-notes. Do not set changelog.disable, it would also drop that file
# and leave the release body empty.

# brew install appetizers-io/tap/outrider. Publishing needs HOMEBREW_TAP_TOKEN
# (contents:write on the tap only); without it the cask is only written to
# dist/ and the release still succeeds. See docs/development.md#homebrew-tap.
homebrew_casks:
  - name: outrider
    description: Watches your GitHub notifications and opens a local coding agent for the PRs that need you
    homepage: https://github.com/appetizers-io/outrider
    repository:
      owner: appetizers-io
      name: homebrew-tap
      # must be exactly one {{ .Env.X }}: GoReleaser applies token templates
      # with ApplySingleEnvOnly (no functions)
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # skip when the secret is missing or empty (the workflow always sets the
    # variable, so isEnvSet would be true even without the secret)
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    commit_msg_template: "outrider {{ .Tag }}"
    dependencies:
      - formula: gh
      - formula: git
    hooks:
      post:
        # the binaries are not signed or notarized
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/outrider"]
          end
    caveats: |
      outrider also needs claude (Claude Code) or codex; tmux only for the tmux launcher.
      Log in to gh first (gh auth login), then in a checkout:
        outrider doctor
        outrider --dry-run --once
        outrider config generate --write
      Docs: https://github.com/appetizers-io/outrider#readme

# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: outrider

builds:
  - main: .
    binary: outrider
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/appetizers-io/outrider/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - src: internal/config/config.example.yaml
        dst: config.example.yaml
      - config.schema.json

checksum:
  name_template: checksums.txt

release:
  # the commit the workflow tested; GitHub creates the tag on it
  target_commitish: "{{ .Commit }}"

changelog:
  disable: true # release notes come from git-cliff (cliff.toml)
